services:
  lavalink:
    build: ./lavalink
    container_name: lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx1024m
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:?err}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-data:/opt/Lavalink/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:2333/v4/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 80s
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Discord__Token=${DISCORD_TOKEN:?err}
      - Discord__OwnerId=${DISCORD_OWNER_ID:-0}
      - Discord__DevGuildId=${DISCORD_DEV_GUILD_ID:-0}
      - Lavalink__BaseAddress=http://lavalink:2333
      - Lavalink__Password=${LAVALINK_PASSWORD:?err}
      - Modmail__GuildId=${MODMAIL_GUILD_ID:?err}
      - Modmail__CategoryId=${MODMAIL_CATEGORY_ID:-0}
    volumes:
      - bot-data:/data
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  botnet:
    driver: bridge

volumes:
  lavalink-data:
  bot-data:
