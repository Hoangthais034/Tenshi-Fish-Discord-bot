services:
  nodelink:
    image: ghcr.io/nonelolly/nodelink:latest
    container_name: nodelink
    restart: unless-stopped
    ports:
      - "2333:2333"
    environment:
      - LAVALINK_SERVER_PASSWORD=${NODELINK_PASSWORD:?err}
    volumes:
      - ./nodelink/application.yml:/app/application.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H \"Authorization: $$LAVALINK_SERVER_PASSWORD\" http://localhost:2333/v4/info"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    image: tenshi-bot
    container_name: discord-bot
    restart: unless-stopped
    depends_on:
      nodelink:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN:?err}
      - DISCORD_OWNER_ID=${DISCORD_OWNER_ID:-0}
      - DISCORD_DEV_GUILD_ID=${DISCORD_DEV_GUILD_ID:-0}
      - NODELINK_HOST=nodelink
      - NODELINK_PORT=2333
      - NODELINK_PASSWORD=${NODELINK_PASSWORD:?err}
      - MODMAIL_GUILD_ID=${MODMAIL_GUILD_ID:?err}
      - MODMAIL_CATEGORY_ID=${MODMAIL_CATEGORY_ID:-0}
      - DATA_PATH=/data/bot-data.db
    volumes:
      - bot-data:/data
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  botnet:
    driver: bridge

volumes:
  bot-data:
