services:
  lavalink:
    build: ./lavalink
    container_name: lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx256m
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:?err}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:2333/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Discord__Token=${DISCORD_TOKEN:?err}
      - Discord__OwnerId=${DISCORD_OWNER_ID:-0}
      - Discord__DevGuildId=${DISCORD_DEV_GUILD_ID:-0}
      - Lavalink__BaseAddress=http://lavalink:2333
      - Lavalink__Password=${LAVALINK_PASSWORD:?err}
      - Modmail__GuildId=${MODMAIL_GUILD_ID:?err}
      - Modmail__CategoryId=${MODMAIL_CATEGORY_ID:-0}
    volumes:
      - ./data:/data:Z
