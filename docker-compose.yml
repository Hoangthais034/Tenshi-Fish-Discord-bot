services:
  nodelink:
    image: performanc/nodelink:latest
    container_name: nodelink
    restart: unless-stopped
    ports:
      - "2333:2333"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NODELINK_SERVER_PORT=2333
      - NODELINK_SERVER_PASSWORD=${NODELINK_PASSWORD:?err}
      - NODELINK_SOURCES_YOUTUBE_ENABLED=true
      - NODELINK_SOURCES_HTTP_ENABLED=true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:2333/version').then(r => process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    image: tenshi-bot
    container_name: discord-bot
    restart: unless-stopped
    depends_on:
      nodelink:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN:?err}
      - DISCORD_OWNER_ID=${DISCORD_OWNER_ID:-0}
      - DISCORD_DEV_GUILD_ID=${DISCORD_DEV_GUILD_ID:-0}
      - NODELINK_HOST=nodelink
      - NODELINK_PORT=2333
      - NODELINK_PASSWORD=${NODELINK_PASSWORD:?err}
      - MODMAIL_GUILD_ID=${MODMAIL_GUILD_ID:?err}
      - MODMAIL_CATEGORY_ID=${MODMAIL_CATEGORY_ID:-0}
      - DATA_PATH=/data/bot-data.db
    volumes:
      - bot-data:/data
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  botnet:
    driver: bridge

volumes:
  bot-data:
