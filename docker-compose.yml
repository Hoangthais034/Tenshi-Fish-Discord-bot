services:
  nodelink:
    image: performanc/nodelink:latest
    container_name: nodelink
    restart: unless-stopped
    environment:
      - NODELINK_SERVER_PASSWORD=${NODELINK_PASSWORD:-youshallnotpass}
      - NODELINK_SERVER_PORT=2333
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:2333/',r=>{process.exit(r.statusCode!==200)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    depends_on:
      nodelink:
        condition: service_healthy
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Discord__Token=${DISCORD_TOKEN:?err}
      - Discord__OwnerId=${DISCORD_OWNER_ID:-0}
      - Discord__DevGuildId=${DISCORD_DEV_GUILD_ID:-0}
      - NodeLink__BaseAddress=http://nodelink:2333
      - NodeLink__Password=${NODELINK_PASSWORD:-youshallnotpass}
      - Modmail__GuildId=${MODMAIL_GUILD_ID:?err}
      - Modmail__CategoryId=${MODMAIL_CATEGORY_ID:-0}
    volumes:
      - ./data:/data:Z
