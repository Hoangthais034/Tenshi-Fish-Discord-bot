services:
  lavalink:
    build: ./lavalink
    image: tenshi-lavalink
    container_name: lavalink
    restart: unless-stopped
    ports:
      - "2333:2333"
    environment:
      - _JAVA_OPTIONS=-Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:?err}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-data:/opt/Lavalink/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Authorization: $LAVALINK_SERVER_PASSWORD' http://localhost:2333/v4/info > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    image: tenshi-bot
    container_name: discord-bot
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Discord__Token=${DISCORD_TOKEN:?err}
      - Discord__OwnerId=${DISCORD_OWNER_ID:-0}
      - Discord__DevGuildId=${DISCORD_DEV_GUILD_ID:-0}
      - Lavalink__BaseAddress=http://lavalink:2333
      - Lavalink__Password=${LAVALINK_PASSWORD:?err}
      - Modmail__GuildId=${MODMAIL_GUILD_ID:?err}
      - Modmail__CategoryId=${MODMAIL_CATEGORY_ID:-0}
      - DATA_PATH=/data/bot-data.db
    volumes:
      - bot-data:/data
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  botnet:
    driver: bridge

volumes:
  lavalink-data:
  bot-data:
