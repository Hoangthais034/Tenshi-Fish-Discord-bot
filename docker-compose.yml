services:
  lavalink:
    build:
      context: ./lavalink
      dockerfile: Dockerfile
    restart: unless-stopped
    # No published ports: the bot reaches Lavalink over the internal network,
    # so Lavalink is not exposed to the internet.
    environment:
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:?err}
      - LAVALINK_SERVER_PORT=2333
      - YOUTUBE_OAUTH_REFRESH_TOKEN=${YOUTUBE_OAUTH_REFRESH_TOKEN:-}
      - YOUTUBE_CIPHER_URL=http://yt-cipher:8001
      - YOUTUBE_CIPHER_PASSWORD=${YOUTUBE_CIPHER_PASSWORD:-}
      - _JAVA_OPTIONS=-Xmx256m -Xms256m
    depends_on:
      - yt-cipher
    # application.yml is baked into the image by lavalink/Dockerfile. It is not
    # bind-mounted because Dokploy re-clones the repo on deploy, which breaks
    # bind mounts that point inside the repo.
    volumes:
      - lavalink-logs:/opt/Lavalink/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -H 'Authorization: ${LAVALINK_PASSWORD}' http://localhost:2333/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Remote YouTube signature decipher service used by the youtube-source plugin.
  # Not published to the host: only Lavalink reaches it over the internal network.
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    restart: unless-stopped
    environment:
      - API_TOKEN=${YOUTUBE_CIPHER_PASSWORD:-}
      - OVERRIDE_PLAYER_VARIANT=IAS
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN:?err}
      - DISCORD_OWNER_ID=${DISCORD_OWNER_ID:-0}
      - DISCORD_DEV_GUILD_ID=${DISCORD_DEV_GUILD_ID:-0}
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:?err}
      - MODMAIL_GUILD_IDS=${MODMAIL_GUILD_IDS:-}
      - MODMAIL_GUILD_ID=${MODMAIL_GUILD_ID:-}
      - MODMAIL_CATEGORY_ID=${MODMAIL_CATEGORY_ID:-0}
      - LOCALE=${LOCALE:-en}
      - DATA_PATH=/data/bot-data.db
    # Named volume so the SQLite database survives redeploys (and can use Dokploy volume backups).
    volumes:
      - bot-data:/data
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  botnet:
    driver: bridge

volumes:
  lavalink-logs:
  bot-data:
