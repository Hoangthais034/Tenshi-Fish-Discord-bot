services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    restart: unless-stopped
    ports:
      - "2333:2333"
    environment:
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:?err}
      - LAVALINK_SERVER_PORT=2333
      - _JAVA_OPTIONS=-Xmx256m -Xms256m
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
      - lavalink-logs:/opt/Lavalink/logs
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:2333/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    image: tenshi-bot
    container_name: discord-bot
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN:?err}
      - DISCORD_OWNER_ID=${DISCORD_OWNER_ID:-0}
      - DISCORD_DEV_GUILD_ID=${DISCORD_DEV_GUILD_ID:-0}
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:?err}
      - MODMAIL_GUILD_ID=${MODMAIL_GUILD_ID:?err}
      - MODMAIL_CATEGORY_ID=${MODMAIL_CATEGORY_ID:-0}
      - DATA_PATH=/data/bot-data.db
    volumes:
      - bot-data:/data
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  botnet:
    driver: bridge

volumes:
  bot-data:
  lavalink-logs:
